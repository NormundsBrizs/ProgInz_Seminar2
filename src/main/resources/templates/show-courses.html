<html xmlns:th="http://www.thymeleaf.org" >
	
<body>
	
	<h1>Kursi:</h1>
	<h2 th:text=${info}></h2>
	
	<table border="1px">
		<tr>
			<td>Id</td>
			<td>Nosaukums</td>
			<td>Kredītpunkti</td>
			<td>Profesors Nr.1</td>
			<td>Profesors Nr.2</td>
		</tr>
		<th:block th:each="course : ${package}">
		<tr>
			<td th:text="${course.idc}" ></td>
			<td th:text="${course.title}" ></td>
			<td th:text="${course.creditpoints}" ></td>
			<td th:each="prof : ${course.professors}">
				<p th:text=${prof.name}></p>
				<p th:text=${prof.surname}></p>
				<p th:text=${prof.degree}></p>
			</td>
		</tr>
		</th:block>
	</table>
	

	
</body>



</html>
