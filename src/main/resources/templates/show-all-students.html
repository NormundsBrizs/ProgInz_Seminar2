<html xmlns:th="http://www.thymeleaf.org" >
	
<body>
	
	<h1>Studentu dati:</h1>
	<h2 th:text=${info}></h2>
	
	<table border="1px">
		<tr>
			<td>Id</td>
			<td>Vārds</td>
			<td>Uzvārds</td>
			<td>Atzīmes</td>
		</tr>
		<th:block th:each="stud : ${package}">
		<tr>
			<td th:text="${stud.idp}" ></td>
			<td th:text="${stud.name}" ></td>
			<td th:text="${stud.surname}" ></td>
			
			<td th:each="gr : ${stud.grades}">
				<p th:text="${gr.grvalue}"></p>
			</td>
		</tr>
		</th:block>
	</table>
	

	
</body>



</html>
